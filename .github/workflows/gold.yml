name: gold-prices

# هر روز یک اجرا شروع می‌شود و خودش هر ۱۰ دقیقه تا پایان ساعت کاری قیمت می‌فرستد.
# اجرای بعدی را خود ربات در پایان نوبت درخواست می‌کند.
# ۵:۰۷ UTC = ۸:۳۷ تهران؛ ربات تا ساعت ۱۰ صبر می‌کند و ۱۰:۰۰ اولین عکس را می‌فرستد.
on:
  schedule:
    - cron: "7 5 * * *"
  workflow_dispatch:

permissions:
  contents: write        # برای ذخیره‌ی قیمت باز/بسته‌ی روز در data/day.json
  actions: write          # برای درخواست اجرای بعدی بعد از سقف ۶ ساعته

concurrency:
  group: gold
  cancel-in-progress: false   # هم‌زمان فقط یک اجرا؛ بقیه در صف می‌مانند

jobs:
  send:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 355
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v5
      - name: Start runner after sign-in
        shell: powershell
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Stop"
          $runnerRoot = Split-Path (Split-Path $env:RUNNER_TEMP -Parent) -Parent
          $user = [System.Security.Principal.WindowsIdentity]::GetCurrent().Name
          $action = New-ScheduledTaskAction -Execute "$env:WINDIR\System32\WindowsPowerShell\v1.0\powershell.exe" -Argument "-NoProfile -WindowStyle Hidden -ExecutionPolicy Bypass -Command `"Set-Location -LiteralPath '$runnerRoot'; & '$runnerRoot\run.cmd'`"" -WorkingDirectory $runnerRoot
          $trigger = New-ScheduledTaskTrigger -AtLogOn -User $user
          $settings = New-ScheduledTaskSettingsSet -StartWhenAvailable -RestartCount 999 -RestartInterval (New-TimeSpan -Minutes 1) -ExecutionTimeLimit ([TimeSpan]::Zero) -MultipleInstances IgnoreNew
          $principal = New-ScheduledTaskPrincipal -UserId $user -LogonType Interactive -RunLevel Limited
          Register-ScheduledTask -TaskName "Vahan Zar Runner" -Action $action -Trigger $trigger -Settings $settings -Principal $principal -Force | Out-Null
          Write-Output "Runner will auto-start after this user signs in."
      - name: Install Python 3.12 if needed
        run: |
          if not exist "%LOCALAPPDATA%\Programs\Python\Python312\python.exe" (
            curl.exe -fL https://www.python.org/ftp/python/3.12.10/python-3.12.10-amd64.exe -o "%RUNNER_TEMP%\python-3.12.10-amd64.exe"
            start /wait "" "%RUNNER_TEMP%\python-3.12.10-amd64.exe" /quiet InstallAllUsers=0 PrependPath=0 Include_launcher=0 Include_test=0 TargetDir="%LOCALAPPDATA%\Programs\Python\Python312"
          )
          echo %LOCALAPPDATA%\Programs\Python\Python312>>%GITHUB_PATH%
          echo %LOCALAPPDATA%\Programs\Python\Python312\Scripts>>%GITHUB_PATH%
          "%LOCALAPPDATA%\Programs\Python\Python312\python.exe" --version
      - run: python -m pip install -r requirements.txt
      - name: Send prices
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          REQUEST_CURL: ${{ secrets.REQUEST_CURL }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          PANEL_MOBILE: ${{ secrets.PANEL_MOBILE }}   # شماره ورود پنل قدیری؛ برای گرفتن خودکار کد پیامکی
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONIOENCODING: "utf-8"
          CHANNEL_ID: "@vahanzar"
          FOOTER_TEXT: "@vahanzar"
          BRAND_NAME: "وهان زر"
          ORDER_PHONE: "09123900723"
          ADDRESS_TEXT: "تقاطع کریمخان و حافظ، مجتمع تجاری الماس کریمخان، همکف، پلاک ۸۷"
          TRUST_TEXT: "فاکتور معتبر، کد ری‌گیری، جواز صنف، تحویل حضوری"   # فقط ادعاهای تأییدشده‌ی مالک
          HOLIDAYS: ""   # تعطیلات رسمی، مثل 2026-11-20,2026-12-01 (جمعه‌ها خودکار تعطیل است)
          ABSHODE_DIVISOR: "4.3318"
          # منبع قیمت: پنل قدیری (cURL ذخیره‌شده). سایت به کانال وصل نیست.
          PRICE_SOURCE: "panel"
          # قیمت پنل هر دقیقه به سایت وهان زر هم فرستاده می‌شود (امضاشده با توکن ربات)
          SITE_SYNC: "1"
          SITE_API_URL: "https://jquffpllnzbuhiyfrori.supabase.co"
          SITE_API_KEY: "sb_publishable_tEr6QjE51hNCRxTkOAf-NA_iy2_78La"   # کلید عمومی سایت؛ محرمانه نیست
          INTERVAL_MINUTES: "10"
          START_HOUR: "10"
          END_HOUR: "20"
          DEMO: "0"
          TZ: "Asia/Tehran"
        run: python gold_bot.py --loop 340
